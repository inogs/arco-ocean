# Checks run before each commit (`uvx pre-commit install`) and in CI (.github/workflows/checks.yml).
# The recipes are validated by the tests (tests/test_recipes.py), with the pinned arco-make.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  # The marimo notebooks: names defined once, cells that form a graph, Markdown as marimo writes it.
  - repo: local
    hooks:
      - id: marimo-check
        name: marimo check
        entry: uvx marimo@0.25.2 check
        language: system
        files: ^tutorials/.*\.py$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse-lint-file

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
