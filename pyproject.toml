[project]
name = "arco-ocean"
version = "1.1"
description = "Documentation and tutorials for the ARCO-OCEAN dataset"
requires-python = ">=3.13"
dependencies = [
    "xarray>=2025.1.1",
    "numpy",
    "cftime",
    "zarr",
    "obstore",
    "dask",
    "distributed",
    "jupyter",
    "pip",
    "matplotlib",
    "cartopy",
    "nc-time-axis",
    "arraylake>=0.33.0",
    "netcdf4>=1.7.4",
    "pooch>=1.9.0",
    "ipython>=9.6.0",
    "icechunk>=2",
    "virtualizarr>=2.5.1",
    "arro3-core>=0.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
# The coarsening notes' doctests and measurements (docs/, tests/): `uv run --only-group notes ...`.
# arco-make at the commit the notes were checked with; move to its release once tagged.
notes = [
    "arcomake[live] @ git+https://github.com/stefanocampanella/arco-make.git@5d010dfd861c89f85c7b2db2df1170189e243224",
    "pytest",
]
