# The web page (site/) on GitHub Pages, deployed from main. Static files, no build: the logo is a
# link to assets/, copied as a file. Pages must be enabled once, with "GitHub Actions" as source
# (Settings, Pages).
name: pages

on:
  push:
    branches: [ main ]
    paths: [ "site/**", "assets/**", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Collect the site
        run: |
          mkdir _site
          cp -rL site/. _site/
          rm _site/*.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
