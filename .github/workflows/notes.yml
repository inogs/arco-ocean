# The coarsening notes' offline examples (docs/coarsen-ocean-datasets.md), with arco-make. The
# live examples need credentials and are run by hand (`pytest --live tests`): never in CI, whose
# logs are public.
name: notes

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv run --frozen --only-group notes pytest -q tests
