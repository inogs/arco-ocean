# The forecast collection's watchdog: every 30 minutes, reads the heartbeat as the web page does
# (site/status.js) and keeps an issue labelled forecast-alert open while the collection is stale,
# aborted or unknown, assigned to ALERT_ASSIGNEES; GitHub emails them (scripts/forecast_watchdog.mjs).
#
# Off until the repository variable FORECAST_STATUS_URL is set (Settings, Secrets and variables,
# Actions, Variables), e.g. to https://ogs-arco-ocean.s3.eu-south-1.amazonaws.com/status/forecast.json,
# once the daily collection publishes its heartbeat; ALERT_ASSIGNEES: logins, comma-separated.
# In a public repository GitHub disables schedules after 60 days without activity, warning by
# email first: enable the workflow again in the Actions tab.
name: forecast-watchdog

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: forecast-watchdog
  cancel-in-progress: false

jobs:
  check:
    if: vars.FORECAST_STATUS_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Check the heartbeat
        env:
          STATUS_URL: ${{ vars.FORECAST_STATUS_URL }}
          ALERT_ASSIGNEES: ${{ vars.ALERT_ASSIGNEES }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uvx --from nodejs-wheel==24.19.0 node scripts/forecast_watchdog.mjs
