# ==== CLIMATOLOGY PARAMETERS ====
time_dim = "time"
period = 365
# Daily bins by day of the year: Feb 29 counts in Feb 28's bin (the lookup rule for consumers).
bins = "day_of_year"
# Statistics over 1993-2018 only: later years are held out for evaluation by consumers.
reference_period = {start = 1993-01-01T00:00:00, end = 2019-01-01T00:00:00}
window = 29
weighting = "gaussian"
weighting_scale = 7

# ==== READING CONFIGURATION ====
[read]
engine = "zarr"
inline_array = false
chunks = {time = "auto", depth = 1, lat = -1, lon = -1}

# ==== PREPROCESSING PIPELINES ====
[[preprocess]]
name = "drop_static_vars"
time_dim = "time"

# ==== POSTPROCESSING PIPELINES ====
# Applied to the computed climatological mean dataset
[[postprocess_climatology]]
name = "assign_var_attrs"

[postprocess_climatology.time]
long_name = "day of a 365-day year (bin)"
comment = "Bin k is day k of a 365-day year (0 = Jan 1, 364 = Dec 31). In leap years, Feb 29 uses bin 58 (Feb 28) and later days use the bin of the same date: index with the day of year minus 1, minus 1 more after Feb 29 in leap years."

[[postprocess_climatology]]
name = "assign_attrs"
title = "ARCO-OCEAN Daily Climatology (1993 - 2018)"
summary = "Multi-year daily climatological means computed from the daily ARCO-OCEAN dataset over the 1993–2018 reference period and using gaussian smoothing in a centered window of 29 days (scale factor: 7 days). Bins are days of a 365-day year (0 = Jan 1): Feb 29 values are pooled with Feb 28 (so that bin holds about a quarter more values) and later days of leap years use the bin of the same date; on Feb 29, use the Feb 28 values."
id = "https://doi.org/10.5281/zenodo.17751760"
Conventions = "CF-1.8, ACDD-1.3"
institution = "National Institute of Oceanography and Applied Geophysics - OGS"
creator_name = "OGS ARCO-OCEAN Development Team"
source = "Derived from ARCO-OCEAN v1.0 (DOI: 10.5281/zenodo.17751760)"
history = "Interpolated from native grids to global 0.25 deg regular grid and written to daily-chunked Zarr format. Multi-year daily mean calculated across 1993–2018 using gaussian smoothing."
license = "CC-BY-4.0"
attribution = "Contains modified Copernicus Climate Change Service (C3S) and Copernicus Marine Environment Monitoring Service (CMEMS) information."
references = "https://github.com/inogs/arco-ocean"
geospatial_lat_min = -90.0
geospatial_lat_max = 90.0
geospatial_lat_units = "degrees_north"
geospatial_lat_resolution = "0.25 degree"
geospatial_lon_min = -180.0
geospatial_lon_max = 180.0
geospatial_lon_units = "degrees_east"
geospatial_lon_resolution = "0.25 degree"
geospatial_vertical_min = 0.494
geospatial_vertical_max = 5727.917
geospatial_vertical_units = "m"
geospatial_vertical_positive = "down"
time_coverage_start = "1993-01-01T00:00:00Z"
time_coverage_end = "2018-12-31T00:00:00Z"
time_coverage_resolution = "P1D"
climatology_base_period = "1993 - 2018"
featureType = "grid"

# Applied to the computed anomaly standard deviation dataset
[[postprocess_anomaly_std]]
name = "assign_var_attrs"

[postprocess_anomaly_std.time]
long_name = "day of a 365-day year (bin)"
comment = "Bin k is day k of a 365-day year (0 = Jan 1, 364 = Dec 31). In leap years, Feb 29 uses bin 58 (Feb 28) and later days use the bin of the same date: index with the day of year minus 1, minus 1 more after Feb 29 in leap years."

[[postprocess_anomaly_std]]
name = "assign_attrs"
title = "ARCO-OCEAN Daily Anomaly Standard Deviations (1993 - 2018)"
summary = "Multi-year daily anomaly standard deviations computed from the daily ARCO-OCEAN dataset over the 1993–2018 reference period and using gaussian smoothing in a centered window of 29 days (scale factor: 7 days). Bins are days of a 365-day year (0 = Jan 1): Feb 29 values are pooled with Feb 28 (so that bin holds about a quarter more values) and later days of leap years use the bin of the same date; on Feb 29, use the Feb 28 values."
id = "https://doi.org/10.5281/zenodo.17751760"
Conventions = "CF-1.8, ACDD-1.3"
institution = "National Institute of Oceanography and Applied Geophysics - OGS"
creator_name = "OGS ARCO-OCEAN Development Team"
source = "Derived from ARCO-OCEAN v1.0 (DOI: 10.5281/zenodo.17751760)"
history = "Interpolated from native grids to global 0.25 deg regular grid and written to daily-chunked Zarr format. Multi-year daily anomaly standard deviations calculated across 1993–2018 using gaussian smoothing."
license = "CC-BY-4.0"
attribution = "Contains modified Copernicus Climate Change Service (C3S) and Copernicus Marine Environment Monitoring Service (CMEMS) information."
references = "https://github.com/inogs/arco-ocean"
geospatial_lat_min = -90.0
geospatial_lat_max = 90.0
geospatial_lat_units = "degrees_north"
geospatial_lat_resolution = "0.25 degree"
geospatial_lon_min = -180.0
geospatial_lon_max = 180.0
geospatial_lon_units = "degrees_east"
geospatial_lon_resolution = "0.25 degree"
geospatial_vertical_min = 0.494
geospatial_vertical_max = 5727.917
geospatial_vertical_units = "m"
geospatial_vertical_positive = "down"
time_coverage_start = "1993-01-01T00:00:00Z"
time_coverage_end = "2018-12-31T00:00:00Z"
time_coverage_resolution = "P1D"
climatology_base_period = "1993 - 2018"
featureType = "grid"

# ==== SAVING CONFIGURATION ====
[save]
consolidated = true
chunks = {time = 1, depth = 1, lat = -1, lon = -1}
compressor = {cname = "lz4", clevel = 1}
