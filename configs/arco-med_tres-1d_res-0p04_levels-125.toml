[[postprocess]]
name = 'transpose'
dims = ['time', 'level', 'lat', 'lon']

[save]
consolidated = true
chunk = {time = 1, level = -1, lat = -1, lon = -1}
compressor = {cname = 'lz4', clevel = 1}

[checks.valid_time_coordinate]
freq = '1D'

[checks.ensure_no_nans]
glofas_mask = ['dis24', 'uparea']
medsea_phys_mask = ['uo', 'vo', 'so', 'thetao', 'bottomT', 'zos', 'mlotst', 'medsea_phys_deptho']
medsea_wave_mask = ['swh', 'mwp', 'mwd', 'usd', 'vsd', 'medsea_wave_deptho']
medsea_bio_mask = ['ph', 'dissic', 'talk', 'spco2', 'fpco2', 'no3', 'po4', 'nh4', 'phyc', 'chl', 'nppv', 'o2', 'medsea_bio_deptho']

