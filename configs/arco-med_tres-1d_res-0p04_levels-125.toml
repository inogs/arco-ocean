engine = 'copernicusmarine'
dataset_version = '202211'
variables = ['deptho']
dataset_part = 'bathy'
service = 'static-arco'
chunks = {latitude = -1, longitude = -1}

[[datasets.medsea_wave_mask.postprocess]]
name = 'regrid'
method = 'conservative'
latitude_dim = 'latitude'
longitude_dim = 'longitude'
kwargs = {skipna = false, output_chunks = {latitude = -1, longitude = -1}}
grid = {south = 30.00, north = 46.00, west = -5.60, east = 36.40, resolution_lat = 0.04, resolution_lon = 0.04}

[[datasets.medsea_wave_mask.postprocess]]
name = 'astype'
dtype = 'float32'
casting = 'same_kind'

[[datasets.medsea_wave_mask.postprocess]]
name = 'is_positive_mask'
variable = 'deptho'
mask_name = 'medsea_wave_mask'

[[datasets.medsea_wave_mask.postprocess]]
name = 'rename'
name_dict = {deptho = 'medsea_wave_deptho'}

[[datasets.medsea_wave_mask.postprocess]]
name = 'rename_coordinates'
name_dict = {latitude = 'lat', longitude = 'lon'}

