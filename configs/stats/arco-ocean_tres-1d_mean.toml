# Mean over the whole time axis of a dataset. Variables without the time dimension (masks,
# bathymetry) are kept unchanged, so the mean can be masked without the main dataset.
# Run through scripts/process.slurm, which finds it as configs/process/<dataset name>.toml.

# ==== READING CONFIGURATION ====
[read]
engine = "icechunk"  # an output of arco-make
inline_array = false
chunks = {time = "auto", depth = 1, lat = -1, lon = -1}

# ==== PREPROCESSING PIPELINES ====
# Same reference period as the climatology (1993-2018): later years are held out.
[[process]]
name = "sel"
time = {start = "1993-01-01", stop = "2018-12-31"}

[[process]]
name = "mean"
dim = "time"

# ==== SAVING CONFIGURATION ====
[save]
# Versions kept: the current one (statistics can be recomputed).
keep_versions = 1
chunks = {depth = 1, lat = -1, lon = -1}
compressors = [{name = "blosc", configuration = {cname = "lz4", clevel = 1, shuffle = "shuffle"}}]
