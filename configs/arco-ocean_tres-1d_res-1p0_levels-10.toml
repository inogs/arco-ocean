# ==== SAVING SECTION ====

[[postprocess]]
name = 'chunk'
time = 1
level = -1
lat = -1
lon = -1

[[postprocess]]
name = 'transpose'
dims = ['time', 'level', 'lat', 'lon']

[[postprocess]]
name = 'masked_fill'
mask_name = 'glorys_mask'
fill_value = 0.0
variables = ['uo', 'vo', 'usi', 'vsi', 'sithick', 'siconc']

[[postprocess]]
name = 'masked_fill'
mask_name = 'waverys_mask'
fill_value = 0.0
variables = ['swh', 'mwp', 'mwd', 'usd', 'vsd']

[[postprocess]]
name = 'assign_var_attrs'

[postprocess.lat]
standard_name = 'latitude'
long_name = 'latitude'
units = 'degrees_north'
unit_long = 'Degrees North'
axis = 'Y'

[postprocess.lon]
standard_name = 'longitude'
long_name = 'longitude'
units = 'degrees_east'
unit_long = 'Degrees East'
axis = 'X'

[postprocess.time]
standard_name = 'time'
long_name = 'time'
axis = 'T'

[postprocess.depth]
standard_name = "depth"
long_name = "ocean depth below geoid"
units = "m"
positive = "down"
axis = "Z"
comment = "Physical depths corresponding to subsampled GLORYS12 model levels (0.49m to 902.34m)."

[postprocess.level]
standard_name = "model_level_number"
long_name = "subsampled vertical level index"
units = "1"
axis = "Z"
comment = "Integer indices (0-9) mapping to original GLORYS12 model levels [0, 4, 8, 12, 16, 20, 24, 28, 32, 34]."

[[postprocess]]
name = 'assign_attrs'
title = "ARCO-OCEAN: Analysis-Ready Cloud-Optimized Ocean Dataset"
summary = "A cloud-optimized dataset of ocean physical properties, sea ice, wave dynamics, and atmospheric/hydrological forcing designed for training data-driven S2S ocean forecasting models."
id = "https://doi.org/10.5281/zenodo.17751760"
Conventions = "CF-1.8, ACDD-1.3"
institution = "National Institute of Oceanography and Applied Geophysics - OGS"
creator_name = "OGS ARCO-OCEAN Development Team"
source = "Merged retrospective reanalyses and hindcasts: CMEMS GLORYS12 (ocean & sea ice), CMEMS WAVERYS (waves), ECMWF ERA5 (atmosphere), and GloFAS v5.0 (river discharge)."
history = "Interpolated from native grids to global 1.0 deg regular grid, subsampled vertical levels to 10 layers (0-902m), and written to daily-chunked Zarr format."
license = "CC-BY-4.0"
attribution = "Contains modified Copernicus Climate Change Service (C3S) and Copernicus Marine Environment Monitoring Service (CMEMS) information."
references = "https://github.com/inogs/arco-ocean"
geospatial_lat_min = -90.0
geospatial_lat_max = 90.0
geospatial_lat_units = "degrees_north"
geospatial_lat_resolution = "1.0 degree"
geospatial_lon_min = -180.0
geospatial_lon_max = 180.0
geospatial_lon_units = "degrees_east"
geospatial_lon_resolution = "1.0 degree"
geospatial_vertical_min = 0.494
geospatial_vertical_max = 902.339
geospatial_vertical_units = "m"
geospatial_vertical_positive = "down"
time_coverage_start = "1993-01-01T00:00:00Z"
time_coverage_end = "2021-06-30T00:00:00Z"
time_coverage_resolution = "P1D"
featureType = "grid"

[save]
consolidated = true
chunk = {time = 1, level = -1, lat = -1, lon = -1}
compressor = {cname = 'lz4', clevel = 1}

[save.encoding.time]
units = 'days since 1970-01-01'
calendar = 'standard'
dtype = 'int32'

[checks.valid_global_ecmwf_coordinates]
latitude_dim = 'lat'
longitude_dim = 'lon'

[checks.valid_time_coordinate]
freq = '1D'

[checks.ensure_no_nans]
glofas_mask = ['uparea', 'dis24']
glorys_mask = ['mlotst', 'uo', 'usi', 'vo', 'vsi', 'sithick', 'siconc', 'so', 'so_bottom', 'thetao', 'thetao_bottom', 'zos', 'glorys_deptho']
waverys_mask = ['swh', 'mwp', 'mwd', 'usd', 'vsd']