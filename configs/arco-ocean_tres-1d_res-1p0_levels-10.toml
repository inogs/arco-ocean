[[datasets.glofas.postprocess]]
name = 'regrid'
method = 'conservative'
latitude_dim = 'latitude'
longitude_dim = 'longitude'
kwargs = {skipna = true, nan_threshold = 0.0}
grid = {south = -90.0, north = 90.0, west = 0.0, east = 359.0, resolution_lat = 1.0, resolution_lon = 1.0}

[[datasets.glofas.postprocess]]
name = 'astype'
casting = 'same_kind'
dtype = 'float32'

[[datasets.glofas.postprocess]]
name = 'rename'
