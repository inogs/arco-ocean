[[datasets.glofas_static.postprocess]]
name = 'rename_coordinates'
name_dict = {latitude = 'lat', longitude = 'lon'}

[[datasets.glofas_static.postprocess]]
name = 'drop_var_attrs'
variables = ['lat', 'lon']

[[datasets.glofas_static.postprocess]]
name = 'drop_attrs'
