# ==== READING CONFIGURATION ====
[read]
engine = "icechunk"  # an output of arco-make
# The statistics (statistics/res=<res>) are one repository with the groups climatology and
# anomaly_std, which share their coordinates: checking one checks the grid of both.
group = "climatology"
inline_array = false
chunks = {time = "auto", depth = -1, lat = -1, lon = -1}

# ==== CHECKS CONFIGURATION ====
[checks.valid_global_ecmwf_coordinates]
latitude_dim = "lat"
longitude_dim = "lon"

# The climatology drops the static variables (`drop_static_vars`), the sea fraction included:
# missing values are checked on the dataset it is computed from (validate/historical.toml).
