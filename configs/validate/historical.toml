# ==== READING CONFIGURATION ====
[read]
engine = "icechunk"  # an output of arco-make
inline_array = false
chunks = {time = "auto", depth = -1, lat = -1, lon = -1}

# ==== CHECKS CONFIGURATION ====
[checks.valid_global_ecmwf_coordinates]
latitude_dim = "lat"
longitude_dim = "lon"

# Dates from the command: arco-make validate --start ... --end ...
[checks.valid_time_coordinate]
time_dim = "time"
freq = "1D"

# Ocean and sea-ice fields exactly inside the sea (seafrac > 0): none missing inside, none
# present outside; every other variable has values everywhere.
[checks.ensure_no_nans]
time_dim = "time"
exact = true
seafrac = ["thetao", "so", "uo", "vo", "zos", "siconc", "sivol", "usic", "vsic"]

# Every data variable has a long_name and units, and no two share a long_name.
[checks.attributes]
